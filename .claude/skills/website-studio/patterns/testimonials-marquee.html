<!--
PATTERN T01 — Testimonials Infinite Marquee
Layout: quote cards drift continuously right-to-left, no pagination, pauses
on hover. Ambient — nothing demands a click. Good when there are many short
quotes and no single one needs to dominate.
Photos: never fabricate a real customer's face. Use a real photo with
consent, an initial-on-colour avatar, or no avatar at all — never a stock
photo standing in for a named person.
Source: adapted from SaaSFrame's testimonial-marquee category
(saasframe.io/sections/specify-testimonial-infinite-marquee-section) and
snippets/motion.md §4. Restyled to tokens, not copied.
-->
<div class="p-tmarquee">
  <div class="p-tmarquee__mask">
    <div class="p-tmarquee__track">
      <!-- render the full quote list twice back to back, so -50% loops seamlessly -->
      <div class="p-tmarquee__card">
        <p class="p-tmarquee__quote">"{{Quote}}"</p>
        <div class="p-tmarquee__by">
          <span class="p-tmarquee__avatar">{{Initial}}</span>
          <div><strong>{{Name}}</strong><span>{{Context — e.g. client since 2024}}</span></div>
        </div>
      </div>
      <!-- repeat .p-tmarquee__card, then repeat the whole set once more -->
    </div>
  </div>
</div>

<style>
.p-tmarquee__mask {
  overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
}
.p-tmarquee__track { display: flex; gap: 1.25rem; width: max-content; animation: p-tmarquee 32s linear infinite; }
.p-tmarquee__mask:hover .p-tmarquee__track { animation-play-state: paused; }
@keyframes p-tmarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.p-tmarquee__card {
  width: min(340px, 80vw); flex-shrink: 0; background: var(--raised); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.5rem;
}
.p-tmarquee__quote { font-family: var(--body); font-size: .95rem; line-height: 1.6; color: var(--ink); margin: 0 0 1.2rem; }
.p-tmarquee__by { display: flex; align-items: center; gap: .7rem; }
.p-tmarquee__avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent-lt); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 600; font-size: .85rem; flex-shrink: 0;
}
.p-tmarquee__by strong { display: block; font-family: var(--display); font-size: .88rem; color: var(--ink); }
.p-tmarquee__by span { font-family: var(--body); font-size: .78rem; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) {
  .p-tmarquee__track { animation: none; overflow-x: auto; }
}
</style>
